---
layout: default
---
<article class="post">
  <h2 class="frame" data-seed="post-{{ page.title }}">{{ page.title }}</h2>
  <p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← all posts</a></p>
</article>
