<meta charset="utf-8">
<script>try{document.documentElement.dataset.mode=localStorage.getItem("kk-mode")==="plain"?"plain":"glitch"}catch(e){document.documentElement.dataset.mode="glitch"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="preload" href="{{ '/assets/fonts/courier-prime-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} · blog" href="{{ '/blog/feed.xml' | relative_url }}">
{% if page.math %}
<link rel="stylesheet" href="{{ '/assets/katex/katex.min.css' | relative_url }}">
<script defer src="{{ '/assets/katex/katex.min.js' | relative_url }}"></script>
<script defer src="{{ '/assets/katex/auto-render.min.js' | relative_url }}"
  onload="renderMathInElement(document.querySelector('.post-body') || document.body, {delimiters: [
    {left: '\\[', right: '\\]', display: true}, {left: '$$', right: '$$', display: true}, {left: '\\(', right: '\\)', display: false}
  ], throwOnError: false});"></script>
{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.data.profile.name | jsonify }},
  "url": {{ site.url | jsonify }},
  "affiliation": { "@type": "CollegeOrUniversity", "name": "IT University of Copenhagen" },
  "sameAs": [{% assign first = true %}{% for l in site.data.profile.top_links %}{% if l.url contains "http" %}{% unless first %},{% endunless %}{{ l.url | jsonify }}{% assign first = false %}{% endif %}{% endfor %}{% for l in site.data.profile.bio_links %}{% if l.url contains "http" %}{% unless first %},{% endunless %}{{ l.url | jsonify }}{% assign first = false %}{% endif %}{% endfor %}]
}
</script>
