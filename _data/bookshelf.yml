# The reading shelf: anything worth reading right now, not only papers.
# `current` is on display. To retire an item, cut its whole entry and paste it under `archive`.
#
# Fields (only title is required):
#   title
#   kind     paper | article | essay | blog | book | talk | video | other   (shown on the card; non-papers get a marked spine)
#   authors  free text, e.g. "Chou, C.-N., Kirsanov, A." or "Style Analytics"
#   source   venue or publication, e.g. "ICLR 2026", "Substack"
#   year
#   url      main link
#   pdf      optional second link
#   note     one line on why it's on the shelf
#   added    YYYY-MM-DD
#   apa      optional; shows a "copy APA" button
#   bibtex   optional; shows a "copy BibTeX" button. Write `bibtex: |` and indent the lines below it.

current:
